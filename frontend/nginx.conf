server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    # Assuming backend runs on a service named 'backend' in the same network
    # or allowing external configuration.
    # For local testing via simple docker run, we might need adjustments,
    # but strictly following the file request:
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
